<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Soal SAS Semester 1 — 16 Mata Pelajaran</title>
<style>
  /* =========================================================
     SOFT APPLE DESIGN SYSTEM (macOS Sequoia & iOS 18 Pastel)
     ========================================================= */
  :root {
    --bg: #F4F5F9;
    --bg-gradient-1: rgba(147, 197, 253, 0.28);
    --bg-gradient-2: rgba(196, 181, 253, 0.24);
    --bg-gradient-3: rgba(253, 186, 140, 0.16);

    --card: rgba(255, 255, 255, 0.82);
    --card-border: rgba(255, 255, 255, 0.90);
    --surface: rgba(255, 255, 255, 0.95);
    --surface-hover: #FFFFFF;
    --grouped: rgba(235, 237, 245, 0.88);
    --stimulus-bg: rgba(248, 250, 255, 0.92);

    --text: #1D1D1F;
    --text-soft: #3A3A3C;
    --secondary: #7E7E87;
    --hairline: rgba(60, 60, 67, 0.09);
    --hairline-strong: rgba(60, 60, 67, 0.16);

    --primary: #3A7BFF;
    --primary-hover: #2563EB;
    --primary-soft: rgba(58, 123, 255, 0.10);
    --primary-glow: rgba(58, 123, 255, 0.22);

    --success: #2EB872;
    --success-soft: rgba(46, 184, 114, 0.11);
    --warning: #F59E0B;
    --warning-soft: rgba(245, 158, 11, 0.12);
    --error: #E5484D;
    --error-soft: rgba(229, 72, 77, 0.10);

    --shadow-sm: 0 2px 10px rgba(20, 24, 40, 0.03);
    --shadow-card: 0 14px 40px rgba(20, 24, 40, 0.05), 0 2px 6px rgba(20, 24, 40, 0.02);
    --shadow-hover: 0 18px 44px rgba(20, 24, 40, 0.09);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html[data-theme="dark"] {
    --bg: #0B0C10;
    --bg-gradient-1: rgba(59, 130, 246, 0.13);
    --bg-gradient-2: rgba(139, 92, 246, 0.12);
    --bg-gradient-3: rgba(236, 72, 153, 0.08);

    --card: rgba(24, 26, 34, 0.82);
    --card-border: rgba(255, 255, 255, 0.09);
    --surface: rgba(34, 37, 48, 0.92);
    --surface-hover: rgba(42, 46, 59, 0.98);
    --grouped: rgba(18, 20, 27, 0.92);
    --stimulus-bg: rgba(20, 23, 32, 0.92);

    --text: #F5F5F7;
    --text-soft: #D1D1D6;
    --secondary: #9496A1;
    --hairline: rgba(255, 255, 255, 0.08);
    --hairline-strong: rgba(255, 255, 255, 0.16);

    --primary: #5E9EFF;
    --primary-hover: #7DB1FF;
    --primary-soft: rgba(94, 158, 255, 0.15);
    --primary-glow: rgba(94, 158, 255, 0.25);

    --success: #3DD68C;
    --success-soft: rgba(61, 214, 140, 0.14);
    --warning: #FBBF24;
    --warning-soft: rgba(251, 191, 36, 0.14);
    --error: #FF6369;
    --error-soft: rgba(255, 99, 105, 0.14);

    --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
    --shadow-card: 0 20px 50px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-hover: 0 22px 54px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.012em;
    transition: background-color 0.35s var(--ease), color 0.35s var(--ease);
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    background:
      radial-gradient(42% 38% at 18% 15%, var(--bg-gradient-1), transparent 70%),
      radial-gradient(38% 36% at 82% 20%, var(--bg-gradient-2), transparent 70%),
      radial-gradient(40% 35% at 50% 88%, var(--bg-gradient-3), transparent 72%);
    pointer-events: none;
    z-index: -1;
    filter: blur(10px);
  }

  button, input, select, textarea { font-family: inherit; }
  .hidden { display: none !important; }

  /* ---------- Top Floating Frosted Bar ---------- */
  .topbar {
    position: sticky;
    top: 14px;
    z-index: 40;
    max-width: 1080px;
    margin: 14px auto 0;
    padding: 0 18px;
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px 8px 14px;
    border-radius: 999px;
    background: var(--card);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-card);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    background: none;
    border: none;
    color: var(--text);
    padding: 0;
    letter-spacing: -0.02em;
  }

  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg, #3A7BFF, #8B5CF6, #EC4899);
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .db-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--grouped);
    color: var(--text-soft);
    border: 1px solid var(--hairline);
  }

  .db-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2EB872;
    box-shadow: 0 0 8px rgba(46, 184, 114, 0.6);
  }

  .db-dot.offline { background: #F59E0B; box-shadow: none; }

  .pill-btn {
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s var(--ease);
  }
  .pill-btn:hover {
    background: var(--surface-hover);
    border-color: var(--hairline-strong);
    transform: translateY(-1px);
  }
  .pill-btn:active { transform: scale(0.96); }

  .icon-btn {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 15px;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s var(--ease);
  }

  /* ---------- Layout ---------- */
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 26px 18px 64px;
  }

  .screen { animation: fadeUp 0.42s var(--ease); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    -webkit-backdrop-filter: blur(32px) saturate(180%);
    backdrop-filter: blur(32px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 26px;
    box-shadow: var(--shadow-card);
    padding: 30px;
  }

  /* ---------- Hero ---------- */
  .hero { text-align: center; margin: 6px 0 26px; }
  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-sm);
    font-size: 12px;
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 12px;
  }
  .hero h1 { font-size: clamp(1.85rem, 4.2vw, 2.65rem); font-weight: 760; letter-spacing: -0.034em; margin: 0 0 10px; line-height: 1.12; }
  .hero p { color: var(--secondary); font-size: 1rem; line-height: 1.55; margin: 0 auto; max-width: 640px; }

  /* ---------- Featured SAS Bahasa Indonesia Banner ---------- */
  .sas-hero-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 22px 26px;
    margin-bottom: 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.13), rgba(139, 92, 246, 0.13), rgba(236, 72, 153, 0.09));
    border: 1.5px solid rgba(59, 130, 246, 0.30);
    box-shadow: var(--shadow-card);
  }

  /* ---------- Filter Bar & Search ---------- */
  .filter-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .search-input {
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--hairline-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
    min-width: 230px;
    outline: none;
  }

  /* ---------- 16 Subject Bento Grid ---------- */
  .subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .subject-card {
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
    border-radius: 22px;
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.22s var(--ease);
  }
  .subject-card:hover { transform: translateY(-3px); background: var(--surface-hover); box-shadow: var(--shadow-hover); border-color: var(--primary); }
  .subject-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .subject-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex-shrink: 0; }
  .subject-cat { font-size: 11px; font-weight: 650; padding: 4px 10px; border-radius: 999px; background: var(--grouped); color: var(--secondary); }
  .subject-title { font-size: 16.5px; font-weight: 700; margin: 0 0 5px; letter-spacing: -0.02em; }
  .subject-desc { font-size: 12.8px; color: var(--secondary); line-height: 1.45; margin: 0 0 14px; }
  .subject-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 11px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--secondary); font-weight: 600; }
  .subject-foot b { color: var(--success); }

  /* ---------- Subject Dedicated Section Hub ---------- */
  .section-banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 24px; padding: 26px 28px; }
  .section-banner-left { display: flex; align-items: center; gap: 18px; }
  .section-big-icon { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; font-size: 32px; flex-shrink: 0; }
  .section-label { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.07em; color: var(--secondary); margin: 0 6px 12px; display: flex; align-items: center; justify-content: space-between; }

  .type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .type-card {
    text-align: left;
    display: flex;
    gap: 13px;
    align-items: flex-start;
    padding: 16px 17px;
    border-radius: 20px;
    background: var(--surface);
    border: 1.5px solid var(--hairline);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s var(--ease);
  }
  .type-card:hover { transform: translateY(-2px); background: var(--surface-hover); box-shadow: var(--shadow-hover); }
  .type-card.active { border-color: var(--primary); background: var(--surface-hover); box-shadow: 0 0 0 4px var(--primary-soft); }
  .type-letter { flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .type-name { font-weight: 650; font-size: 14.5px; margin-bottom: 2px; }
  .type-desc { color: var(--secondary); font-size: 12.5px; line-height: 1.4; }
  .type-meta { margin-top: 8px; font-size: 11.5px; color: var(--secondary); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .meta-pill { padding: 2px 8px; border-radius: 999px; background: var(--grouped); font-weight: 600; color: var(--text-soft); }

  /* ---------- Setup Controls ---------- */
  .setup-card { padding: 22px 26px; display: flex; flex-direction: column; gap: 16px; }
  .setup-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  .control-group { display: flex; flex-direction: column; gap: 6px; }
  .control-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--secondary); padding-left: 4px; }
  .segmented { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--grouped); border: 1px solid var(--hairline); flex-wrap: wrap; }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--secondary);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.8px;
    font-weight: 550;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s var(--ease);
  }
  .segmented button:hover { color: var(--text); }
  .segmented button.active { background: var(--surface-hover); color: var(--text); font-weight: 650; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }

  .primary-btn {
    border: none;
    border-radius: 999px;
    padding: 13px 26px;
    background: linear-gradient(180deg, #4B89FF 0%, var(--primary) 100%);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 8px 22px var(--primary-glow);
    transition: transform 0.18s var(--ease), box-shadow 0.2s var(--ease), filter 0.2s;
  }
  .primary-btn:hover { filter: brightness(1.04); transform: translateY(-1px); box-shadow: 0 12px 26px var(--primary-glow); }
  .primary-btn:active { transform: scale(0.97); }
  .primary-btn:disabled { opacity: 0.4; pointer-events: none; }
  .block { display: block; width: 100%; margin-top: 20px; }

  /* ---------- Quiz Player & Stimulus Story Box ---------- */
  .quiz-card { max-width: 740px; margin: 0 auto; }
  .quiz-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--grouped); color: var(--text-soft); }
  .progress-text { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--secondary); }
  .track { height: 6px; background: var(--grouped); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .fill { height: 100%; width: 0; background: linear-gradient(90deg, #3A7BFF, #8B5CF6); border-radius: inherit; transition: width 0.45s var(--ease); }
  .instruction { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--secondary); margin-bottom: 8px; }

  /* Apple Reader Style Stimulus Passage Box */
  .stimulus-box {
    padding: 18px 22px;
    margin-bottom: 20px;
    border-radius: 18px;
    background: var(--stimulus-bg);
    border: 1px solid var(--hairline-strong);
    border-left: 4px solid var(--primary);
    font-size: 0.96rem;
    line-height: 1.65;
    color: var(--text-soft);
    white-space: pre-line;
    max-height: 290px;
    overflow-y: auto;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
  }

  .stimulus-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .question { font-size: 1.18rem; font-weight: 650; line-height: 1.48; letter-spacing: -0.015em; margin: 0 0 20px; white-space: pre-line; }
  .blank { display: inline-block; min-width: 72px; padding: 0 8px; margin: 0 2px; border-radius: 8px; background: var(--primary-soft); border-bottom: 2px solid var(--primary); color: var(--primary); text-align: center; font-weight: 700; }
  .reported { padding: 14px 18px; border-radius: 16px; background: var(--grouped); border: 1px solid var(--hairline); font-size: 0.98rem; line-height: 1.5; margin: -6px 0 20px; }
  .reported span { color: var(--secondary); font-size: 11px; font-weight: 650; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

  .options { counter-reset: opt; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 10px;
    border: 1.5px solid var(--hairline);
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.45;
    text-align: left;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s var(--ease);
  }
  .option::before {
    counter-increment: opt;
    content: counter(opt, upper-alpha);
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    margin-top: 1px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--secondary);
    background: var(--grouped);
    transition: all 0.2s var(--ease);
  }
  .option:hover { border-color: var(--primary); background: var(--surface-hover); transform: translateY(-1px); }
  .option:hover::before { background: var(--primary); color: #fff; }
  .option:disabled { pointer-events: none; }
  .option:disabled:not(.correct):not(.wrong) { opacity: 0.48; }
  .option.correct { background: var(--success-soft); border-color: var(--success); }
  .option.correct::before { content: "✓"; background: var(--success); color: #fff; }
  .option.wrong { background: var(--error-soft); border-color: var(--error); }
  .option.wrong::before { content: "✕"; background: var(--error); color: #fff; }

  .fill-row { display: flex; gap: 10px; }
  .fill-input {
    flex: 1;
    min-width: 0;
    padding: 14px 20px;
    border-radius: 999px;
    border: 1.5px solid var(--hairline-strong);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  .fill-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .fill-input.correct { border-color: var(--success); background: var(--success-soft); }
  .fill-input.wrong { border-color: var(--error); background: var(--error-soft); }

  .feedback {
    margin-top: 16px;
    padding: 16px 18px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.55;
    animation: fadeUp 0.3s var(--ease);
  }
  .feedback.ok { background: var(--success-soft); border: 1px solid rgba(46, 184, 114, 0.25); }
  .feedback.bad { background: var(--error-soft); border: 1px solid rgba(229, 72, 77, 0.22); }
  .feedback b { display: block; font-size: 14.5px; margin-bottom: 4px; }
  .feedback.ok b { color: var(--success); }
  .feedback.bad b { color: var(--error); }

  .hint { text-align: center; font-size: 12px; color: var(--secondary); margin-top: 14px; }
  .eng-underline { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; color: var(--primary); font-weight: 650; }
  kbd { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--hairline-strong); background: var(--surface); }

  /* ---------- Results ---------- */
  .result-card { max-width: 720px; margin: 0 auto; text-align: center; }
  .ring {
    width: 168px;
    height: 168px;
    margin: 22px auto 16px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
    background: conic-gradient(var(--ring-color, var(--primary)) calc(var(--pct, 0) * 1%), var(--grouped) 0);
  }
  .ring::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: var(--surface); }
  .ring-text { position: relative; z-index: 1; }
  .ring-score { font-size: 2.9rem; font-weight: 750; letter-spacing: -0.04em; line-height: 1; }
  .ring-label { font-size: 12px; color: var(--secondary); margin-top: 4px; }

  .review { text-align: left; margin-top: 28px; }
  .review-item { padding: 13px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--hairline); margin-bottom: 8px; font-size: 13.8px; line-height: 1.5; }
  .review-item summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: flex-start; font-weight: 550; }
  .review-item summary::-webkit-details-marker { display: none; }
  .mark { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
  .review-body { margin: 10px 0 0 32px; color: var(--secondary); font-size: 13.2px; }
  .review-body .good { color: var(--success); font-weight: 600; }
  .review-body .badc { color: var(--error); font-weight: 600; }

  footer { text-align: center; color: var(--secondary); font-size: 12px; padding: 0 16px 34px; }

  @media (max-width: 640px) {
    .card { padding: 22px 16px; border-radius: 22px; }
    .brand-text { display: none; }
    .section-banner { padding: 20px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">

    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];

    try { const b = getBest(slug); if (b === null || v > b) localStorage.setItem(bestKey(slug), v); } catch (e) {}

  /* =====================================================
     LOAD DATA FROM SUPABASE (`bank_soal_sas` + `subjects` + `questions`)
     ===================================================== */
  async function syncFromSupabase() {
    try {
      const [subRes, qRes, sasRes, bioRes, engRes, attRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/subjects?select=*&order=display_order.asc`, { headers: sbHeaders }),
        fetch(`${SUPABASE_URL}/rest/v1/questions?select=*&order=created_at.asc`, { headers: sbHeaders }),
        fetch(`${SUPABASE_URL}/rest/v1/bank_soal_sas?select=*&order=id.asc`, { headers: sbHeaders }),
        fetch(`${SUPABASE_URL}/rest/v1/biologi_questions?select=*&order=code.asc`, { headers: sbHeaders }),
        fetch(`${SUPABASE_URL}/rest/v1/english_sas_questions?select=*&order=code.asc`, { headers: sbHeaders }),
        fetch(`${SUPABASE_URL}/rest/v1/quiz_attempts?select=*&order=created_at.desc&limit=30`, { headers: sbHeaders })
      ]);

      if (subRes.ok && qRes.ok) {
        const subData = await subRes.json();
        const qData = await qRes.json();
        if (Array.isArray(subData) && subData.length > 0) subjects = subData;
        if (Array.isArray(qData) && qData.length > 0) allQuestions = qData;
        if (sasRes.ok) {
          const sasData = await sasRes.json();
          if (Array.isArray(sasData) && sasData.length > 0) sasQuestions = sasData;
        }
        if (bioRes.ok) {
          const bioData = await bioRes.json();
          if (Array.isArray(bioData) && bioData.length > 0) bioQuestions = bioData;
        }
        if (engRes.ok) {
          const engData = await engRes.json();
          if (Array.isArray(engData) && engData.length > 0) engQuestions = engData;
        }
        if (attRes.ok) {
          const attData = await attRes.json();
          if (Array.isArray(attData)) recentAttempts = attData;
        }
        isSupabaseLive = true;
        updateDbBadge(true, `Supabase Live · ${sasQuestions.length} B.Indo + ${bioQuestions.length} Bio + ${engQuestions.length} English`);
        if (!quizQuestions.length) {
          if (activeSubjectSlug) renderSubjectSection(activeSubjectSlug);
          else renderAllSubjectsDirectory();
        }
        return;
      }
    } catch (err) {
      console.warn('Supabase fetch fallback:', err);
    }
    // Try local JSON fallback if offline
    try {
      const localRes = await fetch('./data/bank_soal_sas_bahasa_indonesia_100.json');
      if (localRes.ok) sasQuestions = await localRes.json();
      const localBio = await fetch('./data/bank_soal_biologi_kelas_x.json');
      if (localBio.ok) bioQuestions = await localBio.json();
      const localEng = await fetch('./data/bank_soal_sas_english_x.json');
      if (localEng.ok) engQuestions = await localEng.json();
      const localPjok = await fetch('./data/bank_soal_pjok_60.json');
      if (localPjok.ok) {
        const pjokData = await localPjok.json();
        if (Array.isArray(pjokData) && pjokData.length > 0) {
          const existingCodes = new Set(allQuestions.map(x => x.code).filter(Boolean));
          allQuestions = [...allQuestions, ...pjokData.filter(x => !existingCodes.has(x.code))];
        }
      }
    } catch (e) {}
    updateDbBadge(false, `Mode Lokal (${sasQuestions.length} SAS · ${engQuestions.length} Eng)`);
    if (!quizQuestions.length) {
      if (activeSubjectSlug) renderSubjectSection(activeSubjectSlug);
      else renderAllSubjectsDirectory();
    }
  }

  function updateDbBadge(online, text) {
    const dot = document.getElementById('db-status-dot');
    const txt = document.getElementById('db-status-text');
    if (dot) dot.className = online ? 'db-dot' : 'db-dot offline';
    if (txt) txt.textContent = text;
  }

  function getSubjectQuestions(slug, type = 'M', level = 0) {
    return allQuestions.filter(q =>
      q.subject_slug === slug &&
      (type === 'M' || q.question_type === type) &&
      (level === 0 || Number(q.difficulty) === Number(level))
    );
  }

  function getFilteredSasQuestions(catKey = selSasCat, diffFilter = selSasDiff) {
    const catObj = SAS_CATEGORIES[catKey];
    if (!catObj || catObj.filter === 'KAIDAH') return [];
    return sasQuestions.filter(q => {
      const matchCat = !catObj.filter || q.kategori === catObj.filter;
      const matchDiff = diffFilter === 'ALL' || q.tingkat_kesulitan === diffFilter;
      return matchCat && matchDiff;
    });
  }

  function getFilteredBioQuestions(topicKey = selBioTopic, diffFilter = selBioDiff) {
    const topObj = BIO_TOPICS[topicKey];
    if (!topObj) return [];
    return bioQuestions.filter(q => {
      const matchTop = !topObj.slug || q.topic_slug === topObj.slug;
      const matchDiff = diffFilter === 'ALL' || q.difficulty === diffFilter;
      return matchTop && matchDiff;
    });
  }

  function getFilteredPjokQuestions(topicKey = selPjokTopic, focusFilter = selPjokFocus, diffFilter = selPjokDiff) {
    const topObj = PJOK_TOPICS[topicKey];
    if (!topObj) return [];
    return allQuestions.filter(q => {
      if (q.subject_slug !== 'pjok' || q.question_type !== 'A') return false;
      const inPilganBank = (typeof q.code === 'string' && q.code.startsWith('PJOK-')) || PJOK_TOPIC_NAMES.includes(q.topic);
      if (!inPilganBank) return false;
      if (topObj.topic && q.topic !== topObj.topic) return false;
      if (focusFilter !== 'ALL') {
        const tags = Array.isArray(q.tags) ? q.tags : [];
        if (!tags.includes(focusFilter)) return false;
      }
      if (diffFilter !== 'ALL' && Number(q.difficulty) !== Number(diffFilter)) return false;
      return true;
    });
  }

    app.innerHTML = `

  /* =====================================================
     SCREEN 3: QUIZ PLAYER (Supports 5-Option SAS Story Stimulus & Standard A-F)
     ===================================================== */
  function convertSasRowToPlayable(row) {
    const keys = ['A', 'B', 'C', 'D', 'E'].filter(k => row.opsi && row.opsi[k] !== undefined);
    const rawOpts = keys.map(k => row.opsi[k]);
    const rawCorrectIdx = Math.max(0, keys.indexOf(row.kunci_jawaban));
    const idx = shuffle(rawOpts.map((_, i) => i));
    return {
      isSas: true,
      sasId: row.id,
      subject_slug: 'bahasa-indonesia',
      question_type: 'A',
      topic: row.kategori,
      difficulty_label: row.tingkat_kesulitan,
      stimulus: row.stimulus,
      prompt: row.pertanyaan,
      o: idx.map(i => rawOpts[i]),
      a: Math.max(0, idx.indexOf(rawCorrectIdx)),
      explanation: row.pembahasan,
      orig: row
    };
  }

  function convertBioRowToPlayable(row) {
    const optsArr = Array.isArray(row.options) ? row.options : [];
    const keys = optsArr.map(o => o.key);
    const rawTexts = optsArr.map(o => o.text);
    const rawCorrectIdx = Math.max(0, keys.indexOf(row.correct_answer));
    const idx = shuffle(rawTexts.map((_, i) => i));
    return {
      isBio: true,
      bioCode: row.code,
      subject_slug: 'biologi',
      question_type: 'A',
      topic: row.topic_name,
      difficulty_label: `${row.difficulty.toUpperCase()} (${row.cognitive_level})`,
      stimulus_type: row.stimulus_type || 'none',
      stimulus_content: row.stimulus_content,
      prompt: row.question_text,
      hint: row.hint,
      o: idx.map(i => rawTexts[i]),
      a: Math.max(0, idx.indexOf(rawCorrectIdx)),
      explanation: row.explanation,
      orig: row
    };
  }

  function convertEngRowToPlayable(row) {
    const optsArr = Array.isArray(row.options) ? row.options : [];
    const keys = optsArr.map(o => o.key);
    const rawTexts = optsArr.map(o => o.text);
    const rawCorrectIdx = Math.max(0, keys.indexOf(row.correct_answer));
    const idx = shuffle(rawTexts.map((_, i) => i));
    return {
      isEng: true,
      engCode: row.code,
      subject_slug: 'bahasa-inggris',
      question_type: 'A',
      topic: row.topic_name,
      difficulty_label: `${row.difficulty.toUpperCase()} (${row.cognitive_level})`,
      stimulus_type: row.stimulus_type || 'none',
      stimulus_content: row.stimulus_content,
      prompt: row.question_text,
      hint: row.hint,
      o: idx.map(i => rawTexts[i]),
      a: Math.max(0, idx.indexOf(rawCorrectIdx)),
      explanation: row.explanation,
      orig: row
    };
  }

  function prepareQuestion(q) {
    if (typeof q.code === 'string' && q.code.startsWith('ENG10-') && Array.isArray(q.options) && q.options[0] && typeof q.options[0] === 'object') {
      return convertEngRowToPlayable(q);
    }
    if (q.code && q.question_text && Array.isArray(q.options) && q.options[0] && typeof q.options[0] === 'object') {
      return convertBioRowToPlayable(q);
    }
    if (q.stimulus && q.opsi && q.kunci_jawaban) {
      return convertSasRowToPlayable(q);
    }
    const opts = Array.isArray(q.options) ? q.options : [];
    const t = q.question_type;
    if (!['A', 'E', 'F'].includes(t)) {
      return { ...q, o: opts, a: t === 'C' ? opts : Number(q.correct_index || 0), orig: q };
    }
    const idx = shuffle(opts.map((_, i) => i));
    return {
      ...q,
      o: idx.map(i => opts[i]),
      a: idx.indexOf(Number(q.correct_index || 0)),
      orig: q
    };
  }

  function startQuiz(customList) {
    let pool = [];
    if (customList) {
      pool = customList;
    } else if (activeSubjectSlug === 'bahasa-indonesia' && selSasCat !== 'KAIDAH') {
      pool = getFilteredSasQuestions(selSasCat, selSasDiff);
    } else if (activeSubjectSlug === 'biologi' && bioQuestions.length > 0) {
      pool = getFilteredBioQuestions(selBioTopic, selBioDiff);
    } else if (activeSubjectSlug === 'pjok' && getFilteredPjokQuestions('ALL_PJOK', 'ALL', 'ALL').length > 0) {
      pool = getFilteredPjokQuestions(selPjokTopic, selPjokFocus, selPjokDiff);
    } else if (activeSubjectSlug === 'bahasa-inggris' && engQuestions.length > 0) {
      pool = getFilteredEngQuestions(selEngTopic, selEngDiff);
    } else {
      pool = getSubjectQuestions(activeSubjectSlug, selType, selLevel);
    }
    if (!pool.length) return;
    const limit = customList ? customList.length : (selCount === 0 ? pool.length : Math.min(selCount, pool.length));
    quizQuestions = shuffle(pool).slice(0, limit).map(prepareQuestion);
    current = 0;
    answers = [];
    quizStartTime = Date.now();
    renderQuestion();
  }

  function renderQuestion() {
    window.scrollTo({ top: 0 });
    answered = false;
    const q = quizQuestions[current];
    const subj = subjects.find(s => s.slug === q.subject_slug) || subjects[0];
    const T = TYPES[q.question_type] || TYPES.A;
    const pct = (current / quizQuestions.length) * 100;

    let stimulusHtml = '';
    if (q.stimulus) {
      stimulusHtml = `<div class="stimulus-box">
           <div class="stimulus-label">
             <span>📄 Stimulus Bacaan · ${esc(q.topic || 'SAS Bahasa Indonesia')}</span>
             <span>${q.sasId ? 'Soal #' + q.sasId : ''}</span>
           </div>
           <div>${esc(q.stimulus)}</div>
         </div>`;
    } else if (q.stimulus_content && q.stimulus_type && q.stimulus_type !== 'none') {
      const isEngStmt = Boolean(q.isEng);
      const isTrustedHtml = q.stimulus_type === 'table' || q.stimulus_type === 'svg' || q.stimulus_type === 'html';
      const innerStimulus = isTrustedHtml
        ? q.stimulus_content
        : `<div style="white-space:pre-wrap;">${esc(q.stimulus_content)}</div>`;
      const stimIcon = isEngStmt
        ? (q.stimulus_type === 'announcement' ? '📢 Official Notice / Announcement' : q.stimulus_type === 'html' ? '✍️ Context Sentence' : '📖 Reading Passage')
        : `🔬 Stimulus ${q.stimulus_type.toUpperCase()}`;
      stimulusHtml = `<div class="stimulus-box" style="${(q.stimulus_type === 'table' || q.stimulus_type === 'svg') ? 'max-height:none;' : ''}">
           <div class="stimulus-label">
             <span>${stimIcon} · ${esc(q.topic || (isEngStmt ? 'English SAS X' : 'Biologi Kelas X'))}</span>
             <span>${q.bioCode ? esc(q.bioCode) : q.engCode ? esc(q.engCode) : ''}</span>
           </div>
           <div>${innerStimulus}</div>
         </div>`;
    }

    const hintHtml = q.hint
      ? `<details style="margin-bottom:14px;padding:10px 14px;border-radius:12px;background:var(--warning-soft);border:1px solid rgba(245,158,11,0.28);font-size:13px;color:var(--text-soft);">
           <summary style="cursor:pointer;font-weight:650;color:var(--warning);">💡 Lihat Petunjuk (Hint)</summary>
           <div style="margin-top:6px;">${esc(q.hint)}</div>
         </details>`
      : '';

    let questionHtml = q.isEng ? esc(q.prompt).replace(/\n/g, '<br>') : esc(q.prompt);
    if (q.question_type === 'C') {
      questionHtml = questionHtml.replace(/___/g, '<span class="blank">?</span>');
    }

    let body = '';
    if (q.question_type === 'C') {
      body = `
        <div class="fill-row">
          <input id="fill" class="fill-input" type="text" placeholder="Ketik jawaban singkat di sini…" autocomplete="off">
          <button class="primary-btn" id="check-btn" onclick="checkFill()">Periksa</button>
        </div>`;
    } else {
      const reported = q.question_type === 'D'
        ? `<div class="reported"><span>Pernyataan Utuh</span>${esc(q.o.join(' '))}</div>`
        : '';
      body = reported + `<div class="options">${q.o.map((o, i) => `<button class="option" onclick="choose(${i})"><span>${esc(o)}</span></button>`).join('')}</div>`;
    }

    const diffLabel = q.difficulty_label || levelName(Number(q.difficulty));

    app.innerHTML = `
      <section class="screen">
        <div class="card quiz-card">
          <div class="quiz-head">
            <span class="chip">${subj.icon} ${esc(subj.name)} · ${esc(q.topic || 'Umum')}</span>
            <span class="chip"><span class="dot" style="background:#E5484D"></span>${esc(diffLabel)}</span>
          </div>
          <div class="quiz-head">
            <span class="progress-text">Soal ${current + 1} dari ${quizQuestions.length}</span>
            <button class="pill-btn" onclick="openSubjectSection('${subj.slug}')">✕ Keluar</button>
          </div>
          <div class="track"><div class="fill" id="fill-bar" style="width:${pct}%"></div></div>
          ${stimulusHtml}
          <div class="instruction">${(q.isSas || q.isBio || q.isEng || (q.question_type === 'A' && q.o && q.o.length === 5)) ? 'Pilih satu jawaban yang paling tepat (A, B, C, D, atau E)' : T.instr}</div>
          <h2 class="question">${questionHtml}</h2>
          ${hintHtml}
          ${body}
          <div id="feedback"></div>
          <button class="primary-btn block hidden" id="next-btn" onclick="nextQuestion()">${current === quizQuestions.length - 1 ? 'Lihat Hasil Akhir →' : 'Soal Berikutnya →'}</button>
          <div class="hint">Pintasan Keyboard: <kbd>A</kbd>–<kbd>E</kbd> atau <kbd>1</kbd>–<kbd>5</kbd> untuk memilih · <kbd>Enter</kbd> untuk lanjut</div>
        </div>
      </section>`;

    if (q.question_type === 'C') {
      const input = document.getElementById('fill');
      input.focus();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !answered) { e.preventDefault(); e.stopPropagation(); checkFill(); }
      });
    }
  }

  function showFeedback(correct, correctLetter, correctText, explanation) {
    const fb = document.getElementById('feedback');
    fb.innerHTML = `
      <div class="feedback ${correct ? 'ok' : 'bad'}">
        <b>${correct ? '✓ Jawaban Tepat!' : '✕ Kurang Tepat — Simak Pembahasan HOTS:'}</b>
        ${correct ? '' : `Kunci Jawaban: <strong>${correctLetter ? correctLetter + '. ' : ''}${esc(correctText)}</strong><br>`}
        ${esc(explanation)}
      </div>`;
    document.getElementById('fill-bar').style.width = `${((current + 1) / quizQuestions.length) * 100}%`;
    document.getElementById('next-btn').classList.remove('hidden');
    answered = true;
  }

  function choose(i) {
    if (answered) return;
    const q = quizQuestions[current];
    const buttons = document.querySelectorAll('.option');
    buttons.forEach((b, idx) => {
      b.disabled = true;
      if (idx === q.a) b.classList.add('correct');
    });
    const correct = i === q.a;
    if (!correct) buttons[i].classList.add('wrong');
    const letters = ['A', 'B', 'C', 'D', 'E'];
    answers.push({ q, user: `${letters[i]}. ${q.o[i]}`, correct });
    showFeedback(correct, letters[q.a], q.o[q.a], q.explanation);
  }

  function checkFill() {
    if (answered) return;
    const q = quizQuestions[current];
    const input = document.getElementById('fill');
    const val = input.value;
    if (!val.trim()) { input.focus(); return; }
    const accepted = Array.isArray(q.a) ? q.a : [String(q.a)];
    const correct = accepted.some(x => norm(x) === norm(val));
    input.disabled = true;
    input.classList.add(correct ? 'correct' : 'wrong');
    document.getElementById('check-btn').disabled = true;
    answers.push({ q, user: val.trim(), correct });
    showFeedback(correct, '', accepted.join(' / '), q.explanation);
  }

  function nextQuestion() {
    current++;
    if (current < quizQuestions.length) renderQuestion();
    else showResults();
  }

  /* =====================================================
     SCREEN 4: RESULTS & SUPABASE SCORE SYNC
     ===================================================== */
  async function showResults() {
    window.scrollTo({ top: 0 });
    const subj = subjects.find(s => s.slug === activeSubjectSlug) || subjects[0];
    const correctCount = answers.filter(a => a.correct).length;
    const score = Math.round((correctCount / answers.length) * 100);
    const wrong = answers.filter(a => !a.correct);
    const durationSec = Math.max(1, Math.round((Date.now() - quizStartTime) / 1000));

    setBest(subj.slug, score);

    if (isSupabaseLive && subj.id) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/quiz_attempts`, {
          method: 'POST',
          headers: sbHeaders,
          body: JSON.stringify({
            subject_id: subj.id,
            subject_slug: subj.slug,
            question_type: activeSubjectSlug === 'bahasa-indonesia' ? 'A' : selType,
            difficulty: 3,
            player_name: 'Siswa',
            score,
            correct_count: correctCount,
            total_questions: answers.length,
            duration_seconds: durationSec
          })
        });
      } catch (e) {}
    }

    const ringColor = score >= 80 ? 'var(--success)' : score >= 60 ? 'var(--primary)' : 'var(--error)';
    let msg = score === 100
      ? `Sempurna! Kamu menaklukkan seluruh soal HOTS ${subj.name} dengan akurasi 100%.`
      : score >= 80
      ? `Sangat Bagus! Analisis wacana dan penalaran HOTS kamu sudah sangat kuat.`
      : `Terus berlatih! Baca ulasan pembahasan di bawah untuk memahami logika setiap soal.`;

    const letters = ['A', 'B', 'C', 'D', 'E'];
    const review = answers.map((a, i) => {
      const correctText = a.q.question_type === 'C'
        ? (Array.isArray(a.q.a) ? a.q.a.join(' / ') : a.q.a)
        : `${letters[a.q.a]}. ${a.q.o[a.q.a]}`;
      return `
        <details class="review-item" ${a.correct ? '' : 'open'}>
          <summary>
            <span class="mark" style="background:${a.correct ? 'var(--success)' : 'var(--error)'}">${a.correct ? '✓' : '✕'}</span>
            <span>${i + 1}. [${esc(a.q.topic || 'Umum')}] ${esc(a.q.prompt)}</span>
          </summary>
          <div class="review-body">
            <div>Jawabanmu: <span class="${a.correct ? 'good' : 'badc'}">${esc(a.user)}</span></div>
            ${a.correct ? '' : `<div>Kunci Jawaban: <span class="good">${esc(correctText)}</span></div>`}
            <div style="margin-top:5px;"><strong>Pembahasan:</strong> ${esc(a.q.explanation)}</div>
          </div>
        </details>`;
    }).join('');

    app.innerHTML = `
      <section class="screen">
        <div class="card result-card">
          <div class="chip" style="margin-bottom:10px;">${subj.icon} ${esc(subj.name)} · Tersimpan di Supabase</div>
          <h2 style="margin:0 0 6px;">Evaluasi Selesai!</h2>
          <p style="color:var(--secondary); max-width:440px; margin:0 auto;">${esc(msg)}</p>
          <div class="ring" id="ring" style="--ring-color:${ringColor}">
            <div class="ring-text">
              <div class="ring-score">${score}</div>
              <div class="ring-label">Skor Akhir</div>
            </div>
          </div>
          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
            <span class="chip">✓ ${correctCount} Benar</span>
            <span class="chip">✕ ${wrong.length} Salah</span>
            <span class="chip">⏱ ${durationSec} detik</span>
          </div>
          <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
            ${wrong.length ? `<button class="primary-btn" onclick="retryWrong()">Ulangi Soal yang Salah (${wrong.length})</button>` : ''}
            <button class="pill-btn" onclick="startQuiz()">Latihan Paket Acak Baru</button>
            <button class="pill-btn" onclick="openSubjectSection('${subj.slug}')">Kembali ke Section ${esc(subj.name)}</button>
            <button class="pill-btn" onclick="goAllSubjects()">Semua Mapel (16)</button>
          </div>
          <div class="review">
            <div class="section-label"><span>Review &amp; Pembahasan Lengkap</span></div>
            ${review}
          </div>
        </div>
      </section>`;

    const ring = document.getElementById('ring');
    let p = 0;
    const timer = setInterval(() => {
      p = Math.min(p + 2, score);
      ring.style.setProperty('--pct', p);
      if (p >= score) clearInterval(timer);
    }, 16);
  }

  function retryWrong() {
    const wrongOriginals = answers.filter(a => !a.correct).map(a => a.q.orig);
    startQuiz(wrongOriginals);
  }

  /* =====================================================
     KEYBOARD SHORTCUTS (Supports A-E and 1-5)
     ===================================================== */
  document.addEventListener('keydown', e => {
    if (!quizQuestions.length || !document.querySelector('.quiz-card')) return;
    const nextBtn = document.getElementById('next-btn');
    if ((e.key === 'Enter' || e.key === ' ') && nextBtn && !nextBtn.classList.contains('hidden')) {
      e.preventDefault();
      nextQuestion();
      return;
    }
    if (answered || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
    const map = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, a: 0, b: 1, c: 2, d: 3, e: 4 };
    const idx = map[e.key.toLowerCase()];
    const q = quizQuestions[current];
    if (idx !== undefined && q.o && idx < q.o.length) choose(idx);
  });

  function downloadPage() {
    const blob = new Blob([PAGE_HTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'latihan-soal-sas-semester-1.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  renderAllSubjectsDirectory();
  syncFromSupabase();
</script>
